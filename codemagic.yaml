workflows:
  android-build:
    name: BoraLer Android
    max_build_duration: 60
    environment:
      vars:
        PACKAGE_NAME: "com.boraler.app"
      node: 22
      java: 21
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Sincronizar Capacitor
        script: npx cap sync android
      - name: Gerar APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

